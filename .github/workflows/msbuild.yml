name: MSBuild

on:
  push:
    branches: ["capy_main"]
  pull_request:
    branches: ["capy_main"]

env:
  SOLUTION_FILE_PATH: CapyComputer.slnx
  BUILD_CONFIGURATION: Release
  PLATFORM: x64
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_TRIPLET: x64-windows

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT")) {
            git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          "$env:VCPKG_ROOT" >> $env:GITHUB_PATH

      - name: Create Cache Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Cache vcpkg Binary Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkg-capy-cpp-v2
          restore-keys: |
            ${{ runner.os }}-vcpkg-capy-cpp-

      - name: Install C++ dependencies
        shell: pwsh
        run: |
          vcpkg install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          msbuild "$env:SOLUTION_FILE_PATH" `
            /m `
            /p:Configuration="$env:BUILD_CONFIGURATION" `
            /p:Platform="$env:PLATFORM" `
            /p:VcpkgEnabled=true `
            /p:VcpkgRoot="$env:VCPKG_ROOT\" `
            /p:VcpkgTriplet="$env:VCPKG_TRIPLET"
