name: MSBuild

on:
  push:
    branches: ["capy_main"]
  pull_request:
    branches: ["capy_main"]

env:
  SOLUTION_FILE_PATH: CapyComputer.slnx
  BUILD_CONFIGURATION: Release
  PLATFORM: x64
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_TRIPLET: x64-windows

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Node
        run: node --version

      - name: Verify npm
        run: npm --version

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.VCPKG_ROOT }}")) {
            git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
            & "${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat"
          } else {
            Write-Host "vcpkg already exists"
          }

      - name: Add vcpkg to PATH
        shell: pwsh
        run: |
          echo "${{ env.VCPKG_ROOT }}" >> $env:GITHUB_PATH

      - name: Install C++ dependencies
        shell: pwsh
        run: |
          vcpkg install boost-beast:x64-windows boost-json:x64-windows openssl:x64-windows --triplet x64-windows
          vcpkg integrate install

      - name: Restore NuGet packages
        run: nuget restore "${{ env.SOLUTION_FILE_PATH }}"

      - name: Create Cache Directory
        run: mkdir -p "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"
        shell: bash

      - name: Cache vcpkg Binary Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkg-capy-cpp-v1
          restore-keys: |
            ${{ runner.os }}-vcpkg-capy-cpp-

      - name: Build
        shell: pwsh
        run: |
          msbuild "${{ env.SOLUTION_FILE_PATH }}" `
            /m `
            /p:Configuration="${{ env.BUILD_CONFIGURATION }}" `
            /p:Platform="${{ env.PLATFORM }}" `
            /p:VcpkgEnabled=true `
            /p:VcpkgTriplet="${{ env.VCPKG_TRIPLET }}"